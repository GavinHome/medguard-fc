# 阶段3 过夜验证训练: 4B + 1250轨迹子集(约9h) — 配方验证用, 全量8B视信号租卡
model: mlx-community/Qwen3-4B-4bit
train: true
data: data/processed/overnight
mask_prompt: true
max_seq_length: 2560
batch_size: 1
iters: 2400
learning_rate: 1.0e-4
grad_checkpoint: true
steps_per_report: 50
steps_per_eval: 800
save_every: 400
adapter_path: models/qwen3-4b-sft
lora_parameters:
  rank: 32
  alpha: 64
  dropout: 0.0
  scale: 10.0
