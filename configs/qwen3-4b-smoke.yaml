# 阶段3 冒烟配置: 验证数据管线 + 实测训练吞吐
model: mlx-community/Qwen3-4B-4bit
train: true
data: data/processed
mask_prompt: true
max_seq_length: 4096
batch_size: 1
iters: 20
learning_rate: 1.0e-4
grad_checkpoint: true
steps_per_report: 5
steps_per_eval: 100000
save_every: 100000
adapter_path: models/smoke
lora_parameters:
  rank: 32
  alpha: 64
  dropout: 0.0
  scale: 10.0
